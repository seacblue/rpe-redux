<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700">
  <title>Note timeline navigator states</title>
  <desc>Four states showing no overflow, left overflow, both-side overflow, and merged multi-line mode.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#151a22"/><stop offset="1" stop-color="#0b0e13"/></linearGradient>
    <style>
      .ui { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; fill: #e1e9f2; }
      .muted { fill: #93a2b4; }
      .heading { font-size: 21px; font-weight: 700; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }
    </style>
  </defs>
  <rect width="1280" height="700" fill="url(#bg2)"/>
  <text x="54" y="48" class="ui heading">白条与显示条件</text>
  <text x="54" y="75" class="ui small muted">白条表示 panel 溢出，不表示 note 密度，也不表示歌曲时间。</text>

  <g transform="translate(54 110)">
    <rect width="560" height="230" rx="12" fill="#0b1017" stroke="#394959"/>
    <text x="24" y="34" class="ui heading">A 起点</text><text x="24" y="58" class="ui small muted">value = 0，右侧还有 panel</text>
    <rect x="24" y="76" width="512" height="100" fill="#121b25" stroke="#506376"/>
    <rect x="40" y="76" width="150" height="100" fill="#233244"/><rect x="202" y="76" width="150" height="100" fill="#233244"/><rect x="364" y="76" width="150" height="100" fill="#233244"/>
    <rect x="524" y="76" width="5" height="100" fill="#fff" opacity=".9"/>
    <text x="24" y="207" class="ui small">左按钮 disabled · 右白条 visible · 右按钮 enabled</text>
  </g>

  <g transform="translate(666 110)">
    <rect width="560" height="230" rx="12" fill="#0b1017" stroke="#394959"/>
    <text x="24" y="34" class="ui heading">B 中间</text><text x="24" y="58" class="ui small muted">0 &lt; value &lt; max，两边都有未显示 panel</text>
    <rect x="24" y="76" width="512" height="100" fill="#121b25" stroke="#506376"/>
    <rect x="24" y="76" width="5" height="100" fill="#fff" opacity=".9"/><rect x="52" y="76" width="150" height="100" fill="#233244"/><rect x="214" y="76" width="150" height="100" fill="#233244"/><rect x="376" y="76" width="150" height="100" fill="#233244"/>
    <text x="24" y="207" class="ui small">左白条 visible · 右白条 visible · 两个按钮 enabled</text>
  </g>

  <g transform="translate(54 390)">
    <rect width="560" height="230" rx="12" fill="#0b1017" stroke="#394959"/>
    <text x="24" y="34" class="ui heading">C 终点</text><text x="24" y="58" class="ui small muted">value = max，左侧还有 panel</text>
    <rect x="24" y="76" width="512" height="100" fill="#121b25" stroke="#506376"/>
    <rect x="36" y="76" width="150" height="100" fill="#233244"/><rect x="198" y="76" width="150" height="100" fill="#233244"/><rect x="360" y="76" width="150" height="100" fill="#233244"/>
    <rect x="24" y="76" width="5" height="100" fill="#fff" opacity=".9"/>
    <text x="24" y="207" class="ui small">左白条 visible · 右白条 hidden · 左按钮 enabled</text>
  </g>

  <g transform="translate(666 390)">
    <rect width="560" height="230" rx="12" fill="#0b1017" stroke="#394959"/>
    <text x="24" y="34" class="ui heading">D 合并音符</text><text x="24" y="58" class="ui small muted">多个判定线合成一个 panel，不显示横向 rail</text>
    <rect x="24" y="76" width="512" height="100" fill="#121b25" stroke="#506376"/>
    <rect x="24" y="76" width="512" height="100" fill="#233244"/>
    <path d="M130 110h300M130 142h300" stroke="#314a5c" stroke-width="2"/>
    <text x="24" y="207" class="ui small">无 rail · 无白条 · 继续显示判定线号设置</text>
  </g>
</svg>

