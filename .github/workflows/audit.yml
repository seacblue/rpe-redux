name: Dependency audit

# Weekly advisory scan for the dependencies that ship with the application.
# Dependabot already opens update and security pull requests, but no pull
# request gate reports a vulnerable production dependency, so this job is the
# place to see that. Rust advisories stay with the Dependabot alerts: the
# bundled Tauri stack currently reports an upstream advisory with no fix.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: npm production dependencies
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Audit the production dependencies
        run: npm audit --omit=dev --audit-level=high

  go:
    name: Go reachable vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum

      - name: Scan for reachable vulnerabilities
        # govulncheck resolves the standard library through its own toolchain, so
        # a stdlib advisory reports the Go version CI installs rather than a call
        # in this tree. The finding stays advisory; module upgrades arrive as
        # Dependabot pull requests.
        continue-on-error: true
        working-directory: src/backend
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
