name: Contributor credit

# Credits the human authors of a pull request in the release notes. The job runs
# from the base branch with a write token, reads the changed Changesets through
# the API, and only comments: it never checks out or runs pull request code and
# never edits the contributor's files. Bots and maintainers are skipped, and a
# Changeset that already names its contributors is reported, not touched.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: contributor-credit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  credit:
    if: >-
      github.event.pull_request.user.type != 'Bot' && !startsWith(github.event.pull_request.title, 'chore(release):')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Publish the contributor-credit notice
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/contributorCredit.mjs
